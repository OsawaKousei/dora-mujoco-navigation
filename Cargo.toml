[package]
name = "dora-mujoco-navigation"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "simulator"
path = "src/bin/simulator.rs"

[[bin]]
name = "keyboard"
path = "src/bin/keyboard.rs"

[[bin]]
name = "keyboard_tty"
path = "src/bin/keyboard_tty.rs"

[[bin]]
name = "teleop"
path = "src/bin/teleop.rs"

[[bin]]
name = "odometry"
path = "src/bin/odometry.rs"

[[bin]]
name = "lidar"
path = "src/bin/lidar.rs"

[[bin]]
name = "localization"
path = "src/bin/localization.rs"

[[bin]]
name = "planner"
path = "src/bin/planner.rs"

[[bin]]
name = "controller"
path = "src/bin/controller.rs"

[[bin]]
name = "trajectory_plot"
path = "src/bin/trajectory_plot.rs"

[dependencies]
dora-node-api = "1.1.0"
eyre = "0.6.14"
libc = "0.2"
mujoco-rs = { version = "=6.1.0", features = ["viewer"] }
plotters = "0.3.7"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
