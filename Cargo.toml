[package]
name = "dora-mujoco-navigation"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "simulator"
path = "src/bin/simulator.rs"

[[bin]]
name = "keyboard"
path = "src/bin/keyboard.rs"

[[bin]]
name = "keyboard_tty"
path = "src/bin/keyboard_tty.rs"

[[bin]]
name = "teleop"
path = "src/bin/teleop.rs"

[dependencies]
dora-node-api = "1.1.0"
eyre = "0.6.14"
libc = "0.2"
mujoco-rs = { version = "=6.1.0", features = ["viewer"] }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
